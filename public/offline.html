<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2FAFA3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>testD — ออฟไลน์ชั่วคราว</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101b23; color: #f4faf9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #101b23; }
      main { width: min(100%, 480px); text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; padding: 10px; border-radius: 20px; background: #ffffff; box-shadow: 0 12px 40px rgba(0,0,0,.28); }
      .mark img { width: 100%; height: 100%; object-fit: contain; }
      .status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 7px 12px; border: 1px solid rgba(47,175,163,.45); border-radius: 999px; color: #8ce0d6; font-size: 13px; font-weight: 700; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0ad4e; }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 42px); line-height: 1.15; letter-spacing: 0; }
      p { margin: 16px auto 0; max-width: 390px; color: #b8c8c9; font-size: 16px; line-height: 1.7; }
      .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
      button, a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border-radius: 12px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      button { border: 0; background: #2FAFA3; color: #071412; }
      a { border: 1px solid rgba(244,250,249,.22); color: #f4faf9; }
      .hint { margin-top: 24px; color: #829798; font-size: 13px; }
      @media (prefers-reduced-motion: no-preference) { button { transition: transform .2s ease, filter .2s ease; } button:hover { transform: translateY(-1px); filter: brightness(1.08); } }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="mark"><img src="/favicon.png" alt="testD" /></div>
      <div class="status"><span class="dot" aria-hidden="true"></span> ออฟไลน์ชั่วคราว</div>
      <h1>ยังเชื่อมต่ออินเทอร์เน็ตไม่ได้</h1>
      <p>testD ยังเปิดหน้าที่บันทึกไว้ได้บางส่วน ข้อมูลใหม่และการส่งแบบฟอร์มจะใช้งานได้อีกครั้งเมื่อกลับมาออนไลน์</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">ลองอีกครั้ง</button>
        <a href="/">กลับหน้าหลัก</a>
      </div>
      <p class="hint">เชื่อมต่ออินเทอร์เน็ตแล้วกด “ลองอีกครั้ง”</p>
    </main>
  </body>
</html>
